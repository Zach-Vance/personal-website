<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zach Vance social card</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #f5f5ef; color: #222b25;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        display: grid; grid-template-columns: 1fr 380px; gap: 64px;
        padding: 72px 80px; letter-spacing: -0.03em;
      }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 600; }
      .monogram { font-size: 52px; font-weight: 700; letter-spacing: -0.1em; line-height: 1; }
      .monogram span { font-weight: 400; } .monogram i { color: #668a4e; font-style: normal; }
      .eyebrow { margin-top: 56px; font: 500 20px "Cascadia Code", Consolas, monospace; letter-spacing: 0.1em; color: #426747; }
      h1 { margin-top: 18px; font-size: 92px; line-height: 0.98; letter-spacing: -0.055em; }
      h1 em { display: block; font-family: Georgia, serif; font-weight: 400; color: #426747; }
      .foot { margin-top: 42px; font-size: 24px; color: #626a61; }
      figure { align-self: center; height: 486px; border-radius: 10px; overflow: hidden; border: 1px solid #d8dcd0; box-shadow: 0 18px 40px #4b603426; }
      figure img { width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div>
      <div class="brand"><span class="monogram">z<span>v</span><i>.</i></span>Zach Vance</div>
      <p class="eyebrow">SOFTWARE DEVELOPER · CHARLESTON, SC</p>
      <h1>Good software.<em>Less friction.</em></h1>
      <p class="foot">Backend APIs · Data &amp; integrations · Reliable applications</p>
    </div>
    <figure><img src="../../images/vanceZach.jpg" alt="" /></figure>
  </body>
</html>
