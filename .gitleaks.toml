title = "Repository secret scanning"
[extend]
useDefault = true
[[rules]]
id = "hardcoded-django-secret"
description = "Django secrets must come from the environment"
regex = '''SECRET_KEY\s*=\s*['"][^'"\r\n]{20,}['"]'''

# Public reCAPTCHA site keys and a one-way token digest are not credentials.
[[allowlists]]
paths = ['^supabase/functions/ingest-ai-call/token-hash\.mjs$']
[[allowlists]]
regexTarget = "line"
regexes = ['sitekey|data-sitekey']
